name: Update Developer Dashboard & Metrics

on:
  schedule:
    # Runs every 6 hours automatically to sync new commits & repos
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Dynamic SVG Cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_dashboard.py

      - name: Commit and Push Changes If Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No changes in metrics. Dashboard is up-to-date."
          else
            git commit -m "📊 Auto-sync: Update developer level, XP & language metrics"
            git push
          fi
