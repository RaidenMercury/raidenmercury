<svg width="410" height="390" viewBox="0 0 410 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cardDark" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#1c0d38"/>
      <stop offset="50%" stop-color="#0e0620"/>
      <stop offset="100%" stop-color="#070310"/>
    </radialGradient>

    <!-- Electric Neon Gradient -->
    <linearGradient id="neonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#4c1d95" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
      .bold-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="406" height="386" rx="18" fill="url(#cardDark)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <g transform="translate(24, 22)">
    <circle cx="6" cy="6" r="4" fill="#c084fc" filter="url(#cardGlow)"/>
    <text x="18" y="10" fill="#f8fafc" class="title" font-size="14" letter-spacing="1">THE AUTODIDACT JOURNEY</text>
    <text x="362" y="10" text-anchor="end" fill="#c084fc" class="mono" font-size="10">PROFILE // 01</text>
    <line x1="0" y1="20" x2="362" y2="20" stroke="#2a124c" stroke-width="1"/>
  </g>

  <!-- Narrative Boxes with Ample Padding (62px height each) -->
  <g transform="translate(24, 58)">
    <!-- Box 1: Perfil & Mentalidad -->
    <rect width="362" height="62" rx="10" fill="#140a26" stroke="#2e1254" stroke-width="1"/>
    <circle cx="22" cy="31" r="11" fill="#240f42"/>
    <text x="22" y="35" text-anchor="middle" fill="#c084fc" font-size="12">⚡</text>
    <text x="42" y="24" fill="#e9d5ff" class="bold-txt" font-size="12">Perfil &amp; Enfoque</text>
    <text x="42" y="44" fill="#94a3b8" class="mono" font-size="10">Técnico informático • 100% de dedicación a lo que me atrae</text>

    <!-- Box 2: Apoyo IA -->
    <g transform="translate(0, 70)">
      <rect width="362" height="62" rx="10" fill="#140a26" stroke="#2e1254" stroke-width="1"/>
      <circle cx="22" cy="31" r="11" fill="#240f42"/>
      <text x="22" y="35" text-anchor="middle" fill="#38bdf8" font-size="12">🧠</text>
      <text x="42" y="24" fill="#e9d5ff" class="bold-txt" font-size="12">Apoyo Tecnológico</text>
      <text x="42" y="44" fill="#94a3b8" class="mono" font-size="10">Uso la IA como mentora para entender bases y agilizar dudas</text>
    </g>

    <!-- Box 3: Entorno Fedora -->
    <g transform="translate(0, 140)">
      <rect width="362" height="62" rx="10" fill="#140a26" stroke="#2e1254" stroke-width="1"/>
      <circle cx="22" cy="31" r="11" fill="#240f42"/>
      <text x="22" y="35" text-anchor="middle" fill="#10b981" font-size="12">💻</text>
      <text x="42" y="24" fill="#e9d5ff" class="bold-txt" font-size="12">Entorno: Fedora Workstation</text>
      <text x="42" y="44" fill="#94a3b8" class="mono" font-size="10">Sistema estable y robusto para crear sin complicaciones</text>
    </g>
  </g>

  <!-- Progress Indicators -->
  <g transform="translate(24, 280)">
    <text x="0" y="10" fill="#94a3b8" class="mono" font-size="10">INTERÉS &amp; ENFOQUE TÉCNICO</text>
    <text x="362" y="10" text-anchor="end" fill="#c084fc" class="mono" font-size="10">100% [ACTIVO]</text>
    <rect x="0" y="16" width="362" height="6" rx="3" fill="#150a24"/>
    <rect x="0" y="16" width="362" height="6" rx="3" fill="url(#neonBar)" filter="url(#cardGlow)"/>

    <text x="0" y="38" fill="#94a3b8" class="mono" font-size="10">EXPERIMENTACIÓN PRÁCTICA</text>
    <text x="362" y="38" text-anchor="end" fill="#38bdf8" class="mono" font-size="10">CONSTANTE</text>
    <rect x="0" y="44" width="362" height="6" rx="3" fill="#150a24"/>
    <rect x="0" y="44" width="330" height="6" rx="3" fill="#38bdf8"/>
  </g>

  <!-- Bottom Tag -->
  <g transform="translate(24, 350)">
    <rect width="362" height="24" rx="6" fill="#150a29" stroke="#37155e" stroke-width="1"/>
    <text x="181" y="16" text-anchor="middle" fill="#c084fc" class="mono" font-size="9">✦ APRENDIENDO A CONSTRUIR Y FACILITAR EL DÍA A DÍA ✦</text>
  </g>
</svg>
