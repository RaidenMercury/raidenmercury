<svg width="410" height="360" viewBox="0 0 410 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cardDark" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#1c0d38"/>
      <stop offset="50%" stop-color="#0e0620"/>
      <stop offset="100%" stop-color="#070310"/>
    </radialGradient>

    <!-- Electric Neon Gradient -->
    <linearGradient id="neonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#4c1d95" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
      .bold-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="406" height="356" rx="18" fill="url(#cardDark)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <g transform="translate(24, 22)">
    <circle cx="6" cy="6" r="4" fill="#c084fc" filter="url(#cardGlow)"/>
    <text x="18" y="10" fill="#f8fafc" class="title" font-size="14" letter-spacing="1">THE AUTODIDACT JOURNEY</text>
    <text x="362" y="10" text-anchor="end" fill="#c084fc" class="mono" font-size="10">PROFILE // 01</text>
    <line x1="0" y1="20" x2="362" y2="20" stroke="#2a124c" stroke-width="1"/>
  </g>

  <!-- Narrative Points -->
  <g transform="translate(24, 60)">
    <!-- Origen -->
    <rect width="362" height="52" rx="10" fill="#140a26" stroke="#2e1254" stroke-width="1"/>
    <circle cx="20" cy="26" r="10" fill="#240f42"/>
    <text x="20" y="30" text-anchor="middle" fill="#c084fc" font-size="11">⚡</text>
    <text x="38" y="20" fill="#e9d5ff" class="bold-txt" font-size="12">Origen &amp; Mentalidad</text>
    <text x="38" y="36" fill="#94a3b8" class="mono" font-size="10">Sin academia tradicional • Aprendiendo a cualquier costo</text>

    <!-- Mentor IA -->
    <g transform="translate(0, 58)">
      <rect width="362" height="52" rx="10" fill="#140a26" stroke="#2e1254" stroke-width="1"/>
      <circle cx="20" cy="26" r="10" fill="#240f42"/>
      <text x="20" y="30" text-anchor="middle" fill="#38bdf8" font-size="11">🧠</text>
      <text x="38" y="20" fill="#e9d5ff" class="bold-txt" font-size="12">Mentora: Inteligencia Artificial</text>
      <text x="38" y="36" fill="#94a3b8" class="mono" font-size="10">Acelerador para dominar lógica, bases y resolver dudas</text>
    </g>

    <!-- Laboratorio -->
    <g transform="translate(0, 116)">
      <rect width="362" height="52" rx="10" fill="#140a26" stroke="#2e1254" stroke-width="1"/>
      <circle cx="20" cy="26" r="10" fill="#240f42"/>
      <text x="20" y="30" text-anchor="middle" fill="#10b981" font-size="11">🐧</text>
      <text x="38" y="20" fill="#e9d5ff" class="bold-txt" font-size="12">El Laboratorio: Linux Terminal</text>
      <text x="38" y="36" fill="#94a3b8" class="mono" font-size="10">Arch Linux &amp; Fedora • Rompiendo cosas para entenderlas</text>
    </g>
  </g>

  <!-- Progress Indicators -->
  <g transform="translate(24, 252)">
    <text x="0" y="10" fill="#94a3b8" class="mono" font-size="10">HAMBRE DE APRENDER</text>
    <text x="362" y="10" text-anchor="end" fill="#c084fc" class="mono" font-size="10">100% [MAX]</text>
    <rect x="0" y="16" width="362" height="6" rx="3" fill="#150a24"/>
    <rect x="0" y="16" width="362" height="6" rx="3" fill="url(#neonBar)" filter="url(#cardGlow)"/>

    <text x="0" y="40" fill="#94a3b8" class="mono" font-size="10">DISCIPLINA &amp; EXPERIMENTACIÓN</text>
    <text x="362" y="40" text-anchor="end" fill="#38bdf8" class="mono" font-size="10">ACTIVA</text>
    <rect x="0" y="46" width="362" height="6" rx="3" fill="#150a24"/>
    <rect x="0" y="46" width="330" height="6" rx="3" fill="#38bdf8"/>
  </g>

  <!-- Bottom Tag -->
  <g transform="translate(24, 322)">
    <rect width="362" height="22" rx="6" fill="#150a29" stroke="#37155e" stroke-width="1"/>
    <text x="181" y="15" text-anchor="middle" fill="#c084fc" class="mono" font-size="9">✦ CURIOSITY OVER DEGREES • BUILDING FROM ZERO ✦</text>
  </g>
</svg>
