<svg width="410" height="340" viewBox="0 0 410 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="langCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1b"/>
      <stop offset="60%" stop-color="#140e28"/>
      <stop offset="100%" stop-color="#0b0816"/>
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="406" height="336" rx="16" fill="url(#langCardBg)" stroke="#2d1b4e" stroke-width="1.5"/>
  <rect x="2" y="2" width="406" height="336" rx="16" fill="none" stroke="#d946ef" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Card Header -->
  <text x="24" y="34" fill="#f8fafc" class="title" font-size="15" letter-spacing="1">LANGUAGE EXPERIENCE</text>
  <text x="386" y="34" text-anchor="end" fill="#d946ef" class="mono" font-size="11">CODE METRICS</text>
  <line x1="24" y1="44" x2="386" y2="44" stroke="#2a1845" stroke-width="1"/>

  <!-- Language Rows -->
  
    <!-- Lang 1: Go -->
    <g transform="translate(24, 65)">
      <circle cx="12" cy="12" r="11" fill="#1d1133" stroke="#ec4899" stroke-width="1.2"/>
      <text x="12" y="16" text-anchor="middle" fill="#f1f5f9" class="mono" font-size="10" font-weight="700">1</text>
      
      <text x="34" y="12" fill="#f1f5f9" class="mono" font-size="12" font-weight="600">Go</text>
      <text x="362" y="12" text-anchor="end" fill="#c084fc" class="mono" font-size="11">Lv. 12 (44.3%)</text>
      
      <rect x="34" y="18" width="328" height="6" rx="3" fill="#1b122e"/>
      <rect x="34" y="18" width="128" height="6" rx="3" fill="#ec4899"/>
    </g>
    <!-- Lang 2: Python -->
    <g transform="translate(24, 117)">
      <circle cx="12" cy="12" r="11" fill="#1d1133" stroke="#a855f7" stroke-width="1.2"/>
      <text x="12" y="16" text-anchor="middle" fill="#f1f5f9" class="mono" font-size="10" font-weight="700">2</text>
      
      <text x="34" y="12" fill="#f1f5f9" class="mono" font-size="12" font-weight="600">Python</text>
      <text x="362" y="12" text-anchor="end" fill="#c084fc" class="mono" font-size="11">Lv. 09 (27.9%)</text>
      
      <rect x="34" y="18" width="328" height="6" rx="3" fill="#1b122e"/>
      <rect x="34" y="18" width="81" height="6" rx="3" fill="#a855f7"/>
    </g>
    <!-- Lang 3: HTML -->
    <g transform="translate(24, 169)">
      <circle cx="12" cy="12" r="11" fill="#1d1133" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="12" y="16" text-anchor="middle" fill="#f1f5f9" class="mono" font-size="10" font-weight="700">3</text>
      
      <text x="34" y="12" fill="#f1f5f9" class="mono" font-size="12" font-weight="600">HTML</text>
      <text x="362" y="12" text-anchor="end" fill="#c084fc" class="mono" font-size="11">Lv. 09 (27.7%)</text>
      
      <rect x="34" y="18" width="328" height="6" rx="3" fill="#1b122e"/>
      <rect x="34" y="18" width="80" height="6" rx="3" fill="#06b6d4"/>
    </g>

  <!-- Footer note -->
  <text x="205" y="322" text-anchor="middle" fill="#64748b" class="mono" font-size="10">✦ SYNCED DIRECTLY FROM GITHUB REPOSITORIES ✦</text>
</svg>
