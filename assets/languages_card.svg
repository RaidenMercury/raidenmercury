<svg width="410" height="340" viewBox="0 0 410 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <!-- Diffused Dark Purple Background Gradient -->
    <radialGradient id="diffusedPurpleBg" cx="50%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#261042"/>
      <stop offset="45%" stop-color="#150a26"/>
      <stop offset="85%" stop-color="#0a0514"/>
      <stop offset="100%" stop-color="#07030e"/>
    </radialGradient>
    
    <!-- Secondary soft ambient glow -->
    <radialGradient id="ambientCorner" cx="85%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon Accents -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#7e22ce" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    </style>
  </defs>

  <!-- Diffused Frame -->
  <rect x="2" y="2" width="406" height="336" rx="16" fill="url(#diffusedPurpleBg)"/>
  <rect x="2" y="2" width="406" height="336" rx="16" fill="url(#ambientCorner)"/>
  <rect x="2" y="2" width="406" height="336" rx="16" fill="none" stroke="url(#cardBorderGrad)" stroke-width="1.5"/>

  <!-- Card Header -->
  <text x="24" y="34" fill="#f8fafc" class="title" font-size="15" letter-spacing="1">LANGUAGE EXPERIENCE</text>
  <text x="386" y="34" text-anchor="end" fill="#d946ef" class="mono" font-size="11">CODE METRICS</text>
  <line x1="24" y1="44" x2="386" y2="44" stroke="#2a1845" stroke-width="1"/>

  <!-- Language Rows -->
  
    <!-- Lang 1: Go -->
    <g transform="translate(24, 65)">
      <circle cx="12" cy="12" r="11" fill="#1a0c30" stroke="#ec4899" stroke-width="1.2"/>
      <text x="12" y="16" text-anchor="middle" fill="#f1f5f9" class="mono" font-size="10" font-weight="700">1</text>
      
      <text x="34" y="12" fill="#f1f5f9" class="mono" font-size="12" font-weight="600">Go</text>
      <text x="362" y="12" text-anchor="end" fill="#c084fc" class="mono" font-size="11">Lv. 12 (38.7%)</text>
      
      <rect x="34" y="18" width="328" height="6" rx="3" fill="#140924"/>
      <rect x="34" y="18" width="112" height="6" rx="3" fill="#ec4899"/>
    </g>
    <!-- Lang 2: Python -->
    <g transform="translate(24, 117)">
      <circle cx="12" cy="12" r="11" fill="#1a0c30" stroke="#a855f7" stroke-width="1.2"/>
      <text x="12" y="16" text-anchor="middle" fill="#f1f5f9" class="mono" font-size="10" font-weight="700">2</text>
      
      <text x="34" y="12" fill="#f1f5f9" class="mono" font-size="12" font-weight="600">Python</text>
      <text x="362" y="12" text-anchor="end" fill="#c084fc" class="mono" font-size="11">Lv. 11 (37.1%)</text>
      
      <rect x="34" y="18" width="328" height="6" rx="3" fill="#140924"/>
      <rect x="34" y="18" width="107" height="6" rx="3" fill="#a855f7"/>
    </g>
    <!-- Lang 3: HTML -->
    <g transform="translate(24, 169)">
      <circle cx="12" cy="12" r="11" fill="#1a0c30" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="12" y="16" text-anchor="middle" fill="#f1f5f9" class="mono" font-size="10" font-weight="700">3</text>
      
      <text x="34" y="12" fill="#f1f5f9" class="mono" font-size="12" font-weight="600">HTML</text>
      <text x="362" y="12" text-anchor="end" fill="#c084fc" class="mono" font-size="11">Lv. 09 (24.2%)</text>
      
      <rect x="34" y="18" width="328" height="6" rx="3" fill="#140924"/>
      <rect x="34" y="18" width="70" height="6" rx="3" fill="#06b6d4"/>
    </g>

  <!-- Footer note -->
  <text x="205" y="322" text-anchor="middle" fill="#64748b" class="mono" font-size="10">✦ SYNCED DIRECTLY FROM GITHUB REPOSITORIES ✦</text>
</svg>
