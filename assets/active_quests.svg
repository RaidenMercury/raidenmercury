<svg width="410" height="360" viewBox="0 0 410 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="questCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1b"/>
      <stop offset="60%" stop-color="#140e28"/>
      <stop offset="100%" stop-color="#0b0816"/>
    </linearGradient>
    <linearGradient id="tagPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="neonQuestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title-font { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif; }
      .code-font { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
      .item-name { font-family: 'SF Pro Display', sans-serif; font-size: 13px; font-weight: 700; fill: #f1f5f9; }
      .item-sub { font-family: 'Fira Code', monospace; font-size: 10px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="5" y="5" width="400" height="350" rx="20" fill="url(#questCardBg)" stroke="#2d1b4e" stroke-width="1.5"/>
  <rect x="5" y="5" width="400" height="350" rx="20" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Top Title -->
  <text x="24" y="36" fill="#f8fafc" class="title-font" font-size="16" font-weight="800" letter-spacing="1">ACTIVE QUEST LOG</text>
  <text x="315" y="36" fill="#ec4899" class="code-font" font-size="11" font-weight="700">DUNGEON RAIDS</text>
  <line x1="24" y1="46" x2="386" y2="46" stroke="#2a1845" stroke-width="1.2"/>

  <!-- Quest 1 -->
  <g transform="translate(24, 60)">
    <rect width="360" height="54" rx="10" fill="#150d28" stroke="#321b53" stroke-width="1"/>
    <!-- Icon Pill -->
    <rect x="10" y="9" width="36" height="36" rx="8" fill="#24113d" stroke="#d946ef" stroke-width="1.2" filter="url(#neonQuestGlow)"/>
    <text x="28" y="33" text-anchor="middle" font-size="16">⚔️</text>
    
    <text x="56" y="24" class="item-name">Daily Training: Code 1hr</text>
    <text x="56" y="40" class="item-sub">Reward: +150 EXP • Status: Active</text>
    
    <rect x="290" y="15" width="60" height="24" rx="12" fill="#26103f" stroke="#ec4899" stroke-width="1"/>
    <text x="320" y="31" text-anchor="middle" fill="#fbcfe8" class="code-font" font-size="10" font-weight="700">IN PROG</text>
  </g>

  <!-- Quest 2 -->
  <g transform="translate(24, 126)">
    <rect width="360" height="54" rx="10" fill="#150d28" stroke="#321b53" stroke-width="1"/>
    <rect x="10" y="9" width="36" height="36" rx="8" fill="#24113d" stroke="#a855f7" stroke-width="1.2" filter="url(#neonQuestGlow)"/>
    <text x="28" y="33" text-anchor="middle" font-size="16">🔮</text>
    
    <text x="56" y="24" class="item-name">Build Custom Bot &amp; Tools</text>
    <text x="56" y="40" class="item-sub">Reward: +300 EXP • Status: Ongoing</text>
    
    <rect x="290" y="15" width="60" height="24" rx="12" fill="#26103f" stroke="#a855f7" stroke-width="1"/>
    <text x="320" y="31" text-anchor="middle" fill="#e9d5ff" class="code-font" font-size="10" font-weight="700">LVL UP</text>
  </g>

  <!-- Quest 3 -->
  <g transform="translate(24, 192)">
    <rect width="360" height="54" rx="10" fill="#150d28" stroke="#321b53" stroke-width="1"/>
    <rect x="10" y="9" width="36" height="36" rx="8" fill="#24113d" stroke="#06b6d4" stroke-width="1.2" filter="url(#neonQuestGlow)"/>
    <text x="28" y="33" text-anchor="middle" font-size="16">🌌</text>
    
    <text x="56" y="24" class="item-name">Master Linux &amp; Git Workflow</text>
    <text x="56" y="40" class="item-sub">Reward: +250 EXP • Status: Practicing</text>
    
    <rect x="290" y="15" width="60" height="24" rx="12" fill="#162038" stroke="#06b6d4" stroke-width="1"/>
    <text x="320" y="31" text-anchor="middle" fill="#bae6fd" class="code-font" font-size="10" font-weight="700">75%</text>
  </g>

  <!-- Quest 4 -->
  <g transform="translate(24, 258)">
    <rect width="360" height="54" rx="10" fill="#150d28" stroke="#321b53" stroke-width="1"/>
    <rect x="10" y="9" width="36" height="36" rx="8" fill="#24113d" stroke="#10b981" stroke-width="1.2" filter="url(#neonQuestGlow)"/>
    <text x="28" y="33" text-anchor="middle" font-size="16">💎</text>
    
    <text x="56" y="24" class="item-name">Awaken S-Rank Project</text>
    <text x="56" y="40" class="item-sub">Reward: S-Rank Hunter Title • Locked</text>
    
    <rect x="290" y="15" width="60" height="24" rx="12" fill="#182322" stroke="#10b981" stroke-width="1"/>
    <text x="320" y="31" text-anchor="middle" fill="#a7f3d0" class="code-font" font-size="10" font-weight="700">QUEST</text>
  </g>

  <text x="205" y="336" text-anchor="middle" fill="#64748b" class="code-font" font-size="10">✦ REWARDS RESET DAILY AT MIDNIGHT UTC ✦</text>
</svg>
