<svg width="410" height="360" viewBox="0 0 410 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="techDark" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#1c0d38"/>
      <stop offset="50%" stop-color="#0e0620"/>
      <stop offset="100%" stop-color="#070310"/>
    </radialGradient>

    <!-- Electric Neon Gradient -->
    <linearGradient id="neonBarJava" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <linearGradient id="neonBarPy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="neonBarGo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="neonBarFuture" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#4c1d95" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="glowTech" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
      .bold-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="406" height="356" rx="18" fill="url(#techDark)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <g transform="translate(24, 22)">
    <circle cx="6" cy="6" r="4" fill="#a855f7" filter="url(#glowTech)"/>
    <text x="18" y="10" fill="#f8fafc" class="title" font-size="14" letter-spacing="1">CORE LANGUAGES &amp; STACK</text>
    <text x="362" y="10" text-anchor="end" fill="#c084fc" class="mono" font-size="10">FOCUS // 02</text>
    <line x1="0" y1="20" x2="362" y2="20" stroke="#2a124c" stroke-width="1"/>
  </g>

  <!-- Language 1: Python -->
  <g transform="translate(24, 58)">
    <circle cx="12" cy="12" r="10" fill="#1b1233" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="16" text-anchor="middle" fill="#38bdf8" font-size="10">🐍</text>
    <text x="32" y="12" fill="#f1f5f9" class="bold-txt" font-size="13">Python</text>
    <text x="362" y="12" text-anchor="end" fill="#38bdf8" class="mono" font-size="11">Bots, Scripts &amp; IA</text>

    <rect x="32" y="18" width="330" height="6" rx="3" fill="#140924"/>
    <rect x="32" y="18" width="280" height="6" rx="3" fill="url(#neonBarPy)"/>
  </g>

  <!-- Language 2: Java -->
  <g transform="translate(24, 116)">
    <circle cx="12" cy="12" r="10" fill="#1b1233" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="12" y="16" text-anchor="middle" fill="#f59e0b" font-size="10">☕</text>
    <text x="32" y="12" fill="#f1f5f9" class="bold-txt" font-size="13">Java</text>
    <text x="362" y="12" text-anchor="end" fill="#f59e0b" class="mono" font-size="11">Estructura &amp; Lógica</text>

    <rect x="32" y="18" width="330" height="6" rx="3" fill="#140924"/>
    <rect x="32" y="18" width="250" height="6" rx="3" fill="url(#neonBarJava)"/>
  </g>

  <!-- Language 3: Go -->
  <g transform="translate(24, 174)">
    <circle cx="12" cy="12" r="10" fill="#1b1233" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="12" y="16" text-anchor="middle" fill="#06b6d4" font-size="10">🔵</text>
    <text x="32" y="12" fill="#f1f5f9" class="bold-txt" font-size="13">Go (Golang)</text>
    <text x="362" y="12" text-anchor="end" fill="#06b6d4" class="mono" font-size="11">Sistemas &amp; Redes</text>

    <rect x="32" y="18" width="330" height="6" rx="3" fill="#140924"/>
    <rect x="32" y="18" width="230" height="6" rx="3" fill="url(#neonBarGo)"/>
  </g>

  <!-- Language 4: Futuros Lenguajes -->
  <g transform="translate(24, 232)">
    <circle cx="12" cy="12" r="10" fill="#1b1233" stroke="#c084fc" stroke-width="1.2"/>
    <text x="12" y="16" text-anchor="middle" fill="#c084fc" font-size="10">🔮</text>
    <text x="32" y="12" fill="#f1f5f9" class="bold-txt" font-size="13">Futuros Horizontes</text>
    <text x="362" y="12" text-anchor="end" fill="#c084fc" class="mono" font-size="11">Mente Abierta</text>

    <rect x="32" y="18" width="330" height="6" rx="3" fill="#140924"/>
    <rect x="32" y="18" width="300" height="6" rx="3" fill="url(#neonBarFuture)" filter="url(#glowTech)"/>
  </g>

  <!-- Bottom Quote -->
  <g transform="translate(24, 305)">
    <rect width="362" height="38" rx="8" fill="#140826" stroke="#2e1053" stroke-width="1"/>
    <text x="181" y="17" text-anchor="middle" fill="#e9d5ff" class="bold-txt" font-size="10">&quot;El lenguaje es solo una herramienta.&quot;</text>
    <text x="181" y="30" text-anchor="middle" fill="#94a3b8" class="mono" font-size="9">Lo importante es la lógica y las ganas de resolver problemas.</text>
  </g>
</svg>
