<svg width="410" height="390" viewBox="0 0 410 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="techDark" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#1c0d38"/>
      <stop offset="50%" stop-color="#0e0620"/>
      <stop offset="100%" stop-color="#070310"/>
    </radialGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#4c1d95" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="glowTech" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
      .bold-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .desc-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="406" height="386" rx="18" fill="url(#techDark)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <g transform="translate(24, 22)">
    <circle cx="6" cy="6" r="4" fill="#a855f7" filter="url(#glowTech)"/>
    <text x="18" y="10" fill="#f8fafc" class="title" font-size="14" letter-spacing="1">MOST USED LANGUAGES</text>
    <text x="362" y="10" text-anchor="end" fill="#c084fc" class="mono" font-size="10">GITHUB DB</text>
    <line x1="0" y1="20" x2="362" y2="20" stroke="#2a124c" stroke-width="1"/>
  </g>

  <!-- Real Languages Data Rows -->
  
    <!-- Go Row -->
    <g transform="translate(24, 62)">
      <circle cx="12" cy="14" r="10" fill="#1b1233" stroke="#00ADD8" stroke-width="1.2"/>
      <text x="12" y="18" text-anchor="middle" fill="#00ADD8" font-size="10">●</text>
      
      <text x="32" y="14" fill="#f1f5f9" class="bold-txt" font-size="13">Go</text>
      
      <rect x="290" y="2" width="72" height="20" rx="10" fill="#150a24" stroke="#00ADD8" stroke-width="1"/>
      <text x="326" y="15" text-anchor="middle" fill="#f1f5f9" class="mono" font-size="9" font-weight="700">42.6%</text>

      <text x="32" y="32" class="desc-txt">60.4 KB de código en repositorios públicos</text>
      <rect x="32" y="40" width="330" height="4" rx="2" fill="#140924"/>
      <rect x="32" y="40" width="127" height="4" rx="2" fill="#00ADD8"/>
    </g>
    <!-- Python Row -->
    <g transform="translate(24, 128)">
      <circle cx="12" cy="14" r="10" fill="#1b1233" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="12" y="18" text-anchor="middle" fill="#38bdf8" font-size="10">●</text>
      
      <text x="32" y="14" fill="#f1f5f9" class="bold-txt" font-size="13">Python</text>
      
      <rect x="290" y="2" width="72" height="20" rx="10" fill="#150a24" stroke="#38bdf8" stroke-width="1"/>
      <text x="326" y="15" text-anchor="middle" fill="#f1f5f9" class="mono" font-size="9" font-weight="700">30.5%</text>

      <text x="32" y="32" class="desc-txt">43.2 KB de código en repositorios públicos</text>
      <rect x="32" y="40" width="330" height="4" rx="2" fill="#140924"/>
      <rect x="32" y="40" width="91" height="4" rx="2" fill="#38bdf8"/>
    </g>
    <!-- HTML Row -->
    <g transform="translate(24, 194)">
      <circle cx="12" cy="14" r="10" fill="#1b1233" stroke="#e34c26" stroke-width="1.2"/>
      <text x="12" y="18" text-anchor="middle" fill="#e34c26" font-size="10">●</text>
      
      <text x="32" y="14" fill="#f1f5f9" class="bold-txt" font-size="13">HTML</text>
      
      <rect x="290" y="2" width="72" height="20" rx="10" fill="#150a24" stroke="#e34c26" stroke-width="1"/>
      <text x="326" y="15" text-anchor="middle" fill="#f1f5f9" class="mono" font-size="9" font-weight="700">27.0%</text>

      <text x="32" y="32" class="desc-txt">38.2 KB de código en repositorios públicos</text>
      <rect x="32" y="40" width="330" height="4" rx="2" fill="#140924"/>
      <rect x="32" y="40" width="80" height="4" rx="2" fill="#e34c26"/>
    </g>

  <!-- Bottom Real-time Sync Note -->
  <g transform="translate(24, 330)">
    <rect width="362" height="42" rx="8" fill="#140826" stroke="#2e1053" stroke-width="1"/>
    <text x="181" y="18" text-anchor="middle" fill="#e9d5ff" class="bold-txt" font-size="10">✦ Sincronizado en tiempo real con GitHub API ✦</text>
    <text x="181" y="32" text-anchor="middle" fill="#94a3b8" class="desc-txt">Los proyectos privados se reflejarán al publicarse</text>
  </g>
</svg>
