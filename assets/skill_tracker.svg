<svg width="410" height="360" viewBox="0 0 410 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skillCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1b"/>
      <stop offset="60%" stop-color="#140e28"/>
      <stop offset="100%" stop-color="#0b0816"/>
    </linearGradient>
    <linearGradient id="skillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="skillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="skillGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="skillGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="skillGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <filter id="neonIconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title-font { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif; }
      .code-font { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
      .skill-name { font-family: 'SF Pro Display', sans-serif; font-size: 13px; font-weight: 700; fill: #f1f5f9; }
      .skill-pct { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 600; fill: #c084fc; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="5" y="5" width="400" height="350" rx="20" fill="url(#skillCardBg)" stroke="#2d1b4e" stroke-width="1.5"/>
  <rect x="5" y="5" width="400" height="350" rx="20" fill="none" stroke="#d946ef" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Top Title -->
  <text x="24" y="36" fill="#f8fafc" class="title-font" font-size="16" font-weight="800" letter-spacing="1">SKILL TRACKER</text>
  <text x="310" y="36" fill="#a855f7" class="code-font" font-size="11" font-weight="600">TREE PROGRESS</text>
  <line x1="24" y1="46" x2="386" y2="46" stroke="#2a1845" stroke-width="1.2"/>

  <!-- Skill 1: Python & Logic -->
  <g transform="translate(24, 60)">
    <circle cx="16" cy="16" r="15" fill="#201138" stroke="#d946ef" stroke-width="1.5" filter="url(#neonIconGlow)"/>
    <text x="16" y="21" text-anchor="middle" fill="#f43f5e" font-size="12" font-weight="900">1</text>
    
    <text x="42" y="14" class="skill-name">Python &amp; Core Logic</text>
    <text x="360" y="14" text-anchor="end" class="skill-pct">LVL 42 (68%)</text>
    
    <rect x="42" y="22" width="318" height="6" rx="3" fill="#1b122e"/>
    <rect x="42" y="22" width="216" height="6" rx="3" fill="url(#skillGrad1)"/>
  </g>

  <!-- Skill 2: Web Dev / Frontend -->
  <g transform="translate(24, 116)">
    <circle cx="16" cy="16" r="15" fill="#201138" stroke="#a855f7" stroke-width="1.5" filter="url(#neonIconGlow)"/>
    <text x="16" y="21" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="900">2</text>
    
    <text x="42" y="14" class="skill-name">Web &amp; Modern UI / HTML / CSS</text>
    <text x="360" y="14" text-anchor="end" class="skill-pct">LVL 35 (55%)</text>
    
    <rect x="42" y="22" width="318" height="6" rx="3" fill="#1b122e"/>
    <rect x="42" y="22" width="175" height="6" rx="3" fill="url(#skillGrad2)"/>
  </g>

  <!-- Skill 3: Linux & Terminal -->
  <g transform="translate(24, 172)">
    <circle cx="16" cy="16" r="15" fill="#201138" stroke="#06b6d4" stroke-width="1.5" filter="url(#neonIconGlow)"/>
    <text x="16" y="21" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="900">3</text>
    
    <text x="42" y="14" class="skill-name">Linux &amp; Terminal Mastery</text>
    <text x="360" y="14" text-anchor="end" class="skill-pct">LVL 50 (80%)</text>
    
    <rect x="42" y="22" width="318" height="6" rx="3" fill="#1b122e"/>
    <rect x="42" y="22" width="254" height="6" rx="3" fill="url(#skillGrad3)"/>
  </g>

  <!-- Skill 4: Git & Version Control -->
  <g transform="translate(24, 228)">
    <circle cx="16" cy="16" r="15" fill="#201138" stroke="#10b981" stroke-width="1.5" filter="url(#neonIconGlow)"/>
    <text x="16" y="21" text-anchor="middle" fill="#34d399" font-size="12" font-weight="900">4</text>
    
    <text x="42" y="14" class="skill-name">Git &amp; Workflow Architecture</text>
    <text x="360" y="14" text-anchor="end" class="skill-pct">LVL 40 (62%)</text>
    
    <rect x="42" y="22" width="318" height="6" rx="3" fill="#1b122e"/>
    <rect x="42" y="22" width="197" height="6" rx="3" fill="url(#skillGrad4)"/>
  </g>

  <!-- Skill 5: Creative Problem Solving -->
  <g transform="translate(24, 284)">
    <circle cx="16" cy="16" r="15" fill="#201138" stroke="#f59e0b" stroke-width="1.5" filter="url(#neonIconGlow)"/>
    <text x="16" y="21" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="900">5</text>
    
    <text x="42" y="14" class="skill-name">Creative Problem Solving &amp; AI</text>
    <text x="360" y="14" text-anchor="end" class="skill-pct">LVL 65 (90%)</text>
    
    <rect x="42" y="22" width="318" height="6" rx="3" fill="#1b122e"/>
    <rect x="42" y="22" width="286" height="6" rx="3" fill="url(#skillGrad5)"/>
  </g>
</svg>
