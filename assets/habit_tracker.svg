<svg width="410" height="360" viewBox="0 0 410 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="habitCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1b"/>
      <stop offset="60%" stop-color="#140e28"/>
      <stop offset="100%" stop-color="#0b0816"/>
    </linearGradient>
    <linearGradient id="barGlowPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="40%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="barGlowCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <filter id="barGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title-font { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif; }
      .code-font { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
      .axis-label { font-family: 'Fira Code', monospace; font-size: 10px; fill: #64748b; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="5" y="5" width="400" height="350" rx="20" fill="url(#habitCardBg)" stroke="#2d1b4e" stroke-width="1.5"/>
  <rect x="5" y="5" width="400" height="350" rx="20" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Top Title -->
  <text x="24" y="36" fill="#f8fafc" class="title-font" font-size="16" font-weight="800" letter-spacing="1">HABIT TRACKER</text>
  <text x="315" y="36" fill="#ec4899" class="code-font" font-size="11" font-weight="700">WEEKLY ROUTINE</text>
  <line x1="24" y1="46" x2="386" y2="46" stroke="#2a1845" stroke-width="1.2"/>

  <!-- Histogram Grid lines -->
  <g transform="translate(45, 60)">
    <line x1="0" y1="20" x2="320" y2="20" stroke="#1d1238" stroke-dasharray="3 3"/>
    <line x1="0" y1="60" x2="320" y2="60" stroke="#1d1238" stroke-dasharray="3 3"/>
    <line x1="0" y1="100" x2="320" y2="100" stroke="#1d1238" stroke-dasharray="3 3"/>
    <line x1="0" y1="140" x2="320" y2="140" stroke="#1d1238" stroke-dasharray="3 3"/>
    <!-- Axis base line -->
    <line x1="0" y1="150" x2="320" y2="150" stroke="#371d5b" stroke-width="1.5"/>

    <!-- Glowing Bars (Mon -> Sun) -->
    <!-- Mon -->
    <rect x="15" y="110" width="26" height="40" rx="6" fill="#251642"/>
    <rect x="15" y="110" width="26" height="40" rx="6" fill="url(#barGlowPink)" fill-opacity="0.6"/>
    <!-- Tue -->
    <rect x="58" y="85" width="26" height="65" rx="6" fill="#251642"/>
    <rect x="58" y="85" width="26" height="65" rx="6" fill="url(#barGlowPink)" fill-opacity="0.7"/>
    <!-- Wed -->
    <rect x="101" y="60" width="26" height="90" rx="6" fill="#251642"/>
    <rect x="101" y="60" width="26" height="90" rx="6" fill="url(#barGlowPink)" fill-opacity="0.8"/>
    <!-- Thu -->
    <rect x="144" y="45" width="26" height="105" rx="6" fill="#251642"/>
    <rect x="144" y="45" width="26" height="105" rx="6" fill="url(#barGlowPink)" fill-opacity="0.85"/>
    <!-- Fri -->
    <rect x="187" y="30" width="26" height="120" rx="6" fill="#251642"/>
    <rect x="187" y="30" width="26" height="120" rx="6" fill="url(#barGlowPink)" filter="url(#barGlow)"/>
    <circle cx="200" cy="20" r="3" fill="#ffffff"/>
    <!-- Sat -->
    <rect x="230" y="50" width="26" height="100" rx="6" fill="#251642"/>
    <rect x="230" y="50" width="26" height="100" rx="6" fill="url(#barGlowPink)" fill-opacity="0.85"/>
    <!-- Sun (Target/Active) -->
    <rect x="273" y="15" width="26" height="135" rx="6" fill="url(#barGlowPink)" filter="url(#barGlow)"/>
    <circle cx="286" cy="7" r="3.5" fill="#ffffff" filter="url(#barGlow)"/>

    <!-- Labels below bars -->
    <text x="28" y="170" text-anchor="middle" class="axis-label">MON</text>
    <text x="71" y="170" text-anchor="middle" class="axis-label">TUE</text>
    <text x="114" y="170" text-anchor="middle" class="axis-label">WED</text>
    <text x="157" y="170" text-anchor="middle" class="axis-label">THU</text>
    <text x="200" y="170" text-anchor="middle" class="axis-label" fill="#c084fc">FRI</text>
    <text x="243" y="170" text-anchor="middle" class="axis-label">SAT</text>
    <text x="286" y="170" text-anchor="middle" class="axis-label" fill="#f43f5e" font-weight="700">SUN</text>
  </g>

  <!-- Bottom Metric Progress & UP section (Matches reference image) -->
  <g transform="translate(24, 255)">
    <!-- UP indicator -->
    <rect x="0" y="0" width="56" height="26" rx="6" fill="#23103c" stroke="#d946ef" stroke-width="1"/>
    <text x="28" y="18" text-anchor="middle" fill="#f0abfc" class="code-font" font-size="12" font-weight="800">▲ UP</text>

    <!-- Metrics -->
    <text x="75" y="12" fill="#94a3b8" class="code-font" font-size="10">LEARNING CONSISTENCY</text>
    <text x="75" y="26" fill="#38bdf8" class="code-font" font-size="12" font-weight="700">+24.5% THIS WEEK</text>

    <text x="360" y="20" text-anchor="end" fill="#f43f5e" class="code-font" font-size="14" font-weight="800">S-TIER</text>

    <!-- Mini Progress Bars -->
    <rect x="0" y="38" width="170" height="6" rx="3" fill="#1c1233"/>
    <rect x="0" y="38" width="135" height="6" rx="3" fill="url(#barGlowPink)"/>

    <rect x="190" y="38" width="170" height="6" rx="3" fill="#1c1233"/>
    <rect x="190" y="38" width="150" height="6" rx="3" fill="#38bdf8"/>

    <!-- Bottom summary row -->
    <text x="0" y="62" fill="#64748b" class="code-font" font-size="10">DAILY COMMITMENT</text>
    <text x="190" y="62" fill="#64748b" class="code-font" font-size="10">HUNTER MOMENTUM</text>
    <text x="360" y="62" text-anchor="end" fill="#a855f7" class="code-font" font-size="10">ACTIVE ✦</text>
  </g>
</svg>
