<svg width="410" height="360" viewBox="0 0 410 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1b"/>
      <stop offset="60%" stop-color="#140e28"/>
      <stop offset="100%" stop-color="#0b0816"/>
    </linearGradient>
    <linearGradient id="avatarGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="expGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonPinkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title-font { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif; }
      .code-font { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
      .stat-label { font-family: 'Fira Code', monospace; font-size: 11px; fill: #94a3b8; }
      .stat-val { font-family: 'SF Pro Display', sans-serif; font-size: 13px; font-weight: 700; fill: #f1f5f9; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="5" y="5" width="400" height="350" rx="20" fill="url(#cardBg)" stroke="#2d1b4e" stroke-width="1.5"/>
  <rect x="5" y="5" width="400" height="350" rx="20" fill="none" stroke="url(#avatarGlowGrad)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Top Title -->
  <text x="24" y="36" fill="#f8fafc" class="title-font" font-size="16" font-weight="800" letter-spacing="1">HUNTER STATUS</text>
  <text x="175" y="36" fill="#c084fc" class="code-font" font-size="11" font-weight="600">[SYS_ID: #7729]</text>
  <line x1="24" y1="46" x2="386" y2="46" stroke="#2a1845" stroke-width="1.2"/>

  <!-- Avatar Circle Section (with neon glowing ring like reference) -->
  <g transform="translate(85, 128)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="url(#avatarGlowGrad)" stroke-width="4" filter="url(#ringGlow)"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>
    
    <!-- Avatar Clip and Silhouette -->
    <clipPath id="avatarClip">
      <circle cx="0" cy="0" r="49"/>
    </clipPath>
    <g clip-path="url(#avatarClip)">
      <rect x="-50" y="-50" width="100" height="100" fill="#1b1035"/>
      <!-- Soft ambient backdrop -->
      <circle cx="0" cy="15" r="35" fill="#a855f7" fill-opacity="0.4"/>
      <!-- Anime Silhouette vector / Hunter icon -->
      <path d="M-18 45 C-18 20, 18 20, 18 45 Z" fill="#381b66"/>
      <circle cx="0" cy="6" r="17" fill="#fbcfe8"/>
      <!-- Hair & details -->
      <path d="M-22 6 C-20 -15, 0 -22, 20 -10 C22 10, 20 18, 16 22 C14 8, 10 -4, 0 -6 C-10 -4, -14 8, -16 22 C-20 18, -22 10, -22 6 Z" fill="#1e1035"/>
      <path d="M-15 1 C-8 -12, 10 -10, 15 2 C8 6, 2 5, -2 3 C-6 5, -12 6, -15 1 Z" fill="#4a1d96"/>
      <!-- Glowing Eyes -->
      <circle cx="-5" cy="5" r="2.5" fill="#f43f5e" filter="url(#ringGlow)"/>
      <circle cx="5" cy="5" r="2.5" fill="#f43f5e" filter="url(#ringGlow)"/>
    </g>

    <text x="0" y="70" text-anchor="middle" fill="#e2e8f0" class="code-font" font-size="12" font-weight="700">@RaidenMercury</text>
  </g>

  <!-- Player Attributes List (Right side of avatar) -->
  <g transform="translate(170, 75)">
    <!-- Class -->
    <circle cx="8" cy="8" r="4" fill="#a855f7"/>
    <text x="20" y="12" class="stat-label">CLASS</text>
    <text x="95" y="12" class="stat-val">Novice Hunter</text>

    <!-- Rank -->
    <circle cx="8" cy="34" r="4" fill="#ec4899"/>
    <text x="20" y="38" class="stat-label">RANK</text>
    <text x="95" y="38" fill="#ec4899" class="stat-val" font-weight="800">E-Rank [Awakening]</text>

    <!-- Level -->
    <circle cx="8" cy="60" r="4" fill="#38bdf8"/>
    <text x="20" y="64" class="stat-label">LEVEL</text>
    <text x="95" y="64" class="stat-val">01 <tspan fill="#64748b" font-size="11">/ 99</tspan></text>

    <!-- Mana / Focus -->
    <circle cx="8" cy="86" r="4" fill="#a855f7"/>
    <text x="20" y="90" class="stat-label">FOCUS</text>
    <text x="95" y="90" class="stat-val">100%</text>

    <!-- Title -->
    <circle cx="8" cy="112" r="4" fill="#eab308"/>
    <text x="20" y="116" class="stat-label">PATH</text>
    <text x="95" y="116" class="stat-val">Self-Taught</text>
  </g>

  <!-- Level Progress Bar Section (EXP) -->
  <g transform="translate(24, 230)">
    <text x="0" y="12" fill="#cbd5e1" class="code-font" font-size="11" font-weight="600">EXPERIENCE (EXP)</text>
    <text x="360" y="12" text-anchor="end" fill="#f472b6" class="code-font" font-size="11" font-weight="700">450 / 1000 XP (45%)</text>
    
    <!-- Bar Track -->
    <rect x="0" y="20" width="360" height="12" rx="6" fill="#170f2b" stroke="#371d5b" stroke-width="1"/>
    <!-- Bar Progress -->
    <rect x="1" y="21" width="162" height="10" rx="5" fill="url(#expGrad)" filter="url(#ringGlow)"/>
    
    <text x="0" y="46" fill="#64748b" class="code-font" font-size="10">LEVEL 01</text>
    <text x="180" y="46" text-anchor="middle" fill="#c084fc" class="code-font" font-size="10">✦ DAILY PROGRESSION ✦</text>
    <text x="360" y="46" text-anchor="end" fill="#64748b" class="code-font" font-size="10">LEVEL 02</text>
  </g>

  <!-- Bottom Quick Status Tags -->
  <g transform="translate(24, 302)">
    <rect x="0" y="0" width="112" height="24" rx="12" fill="#190e2f" stroke="#7e22ce" stroke-width="1"/>
    <text x="56" y="16" text-anchor="middle" fill="#e9d5ff" class="code-font" font-size="10">🔥 STREAK: ON</text>

    <rect x="124" y="0" width="112" height="24" rx="12" fill="#190e2f" stroke="#ec4899" stroke-width="1"/>
    <text x="180" y="16" text-anchor="middle" fill="#fbcfe8" class="code-font" font-size="10">⚔️ QUEST: ACTIVE</text>

    <rect x="248" y="0" width="112" height="24" rx="12" fill="#190e2f" stroke="#06b6d4" stroke-width="1"/>
    <text x="304" y="16" text-anchor="middle" fill="#bae6fd" class="code-font" font-size="10">🛡️ GUILD: OPEN</text>
  </g>
</svg>
